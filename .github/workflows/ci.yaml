name: Build And Push Docker Image

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub...
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate timestamp tag...
        run: echo "VERSION=$(date +'%Y-%m-%d-%H%M%S')" >> $GITHUB_ENV

      - name: Build and push Docker images
        run: |
          docker build -t yomihubhub/user-feedback-app:backend-${VERSION} ./backend
          docker build -t yomihubhub/user-feedback-app:frontend-${VERSION} ./frontend

          docker push yomihubhub/user-feedback-app:backend-${VERSION}
          docker push yomihubhub/user-feedback-app:frontend-${VERSION}
        
