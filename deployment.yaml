apiVersion: apps/v1
kind: Deployment
metadata:
  name: ufa-backend
  labels:
    app: ufa-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ufa-backend
  template:
    metadata:
      labels:
        app: ufa-backend
    spec:
      containers:
        - name: backend
          image: yomihubhub/user-feedback-app:backend-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000


---
apiVersion: v1
kind: Service
metadata:
  name: ufa-backend-service
  labels:
    app: ufa-backend
    release: prometheus
spec:
  selector:
    app: ufa-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ufa-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ufa-frontend
  template:
    metadata:
      labels:
        app: ufa-frontend
    spec:
      containers:
        - name: frontend
          image: yomihubhub/user-feedback-app:frontend-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ufa-frontend-service
spec:
  selector:
    app: ufa-frontend
  ports:
    - port: 80
      targetPort: 80
  type: NodePort